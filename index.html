<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Matrix Digital Rain - AhadProCoder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #00ff66;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid #00ff66;
      border-radius: 9999px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
    }
    .hud-title {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 20px #00ff66;
      margin-top: 4px;
    }
    .hud-subtitle {
      font-size: 13px;
      color: #6ee7b7;
      letter-spacing: 1px;
    }
    .controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }
    button {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #00ff66;
      color: #00ff66;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
    }
    button:hover {
      background: #00ff66;
      color: #030712;
      box-shadow: 0 0 25px #00ff66;
      transform: translateY(-2px);
    }
    .brand-tag {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 10;
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.5);
    }
    .brand-tag span {
      color: #00ff66;
      font-weight: bold;
    }
    @media (max-width: 768px), (orientation: portrait) {
      .hud-overlay { top: 16px; left: 16px; right: 16px; }
      .hud-badge { font-size: 10px; padding: 4px 10px; }
      .hud-title { font-size: clamp(20px, 6vw, 26px); }
      .hud-subtitle { font-size: clamp(10px, 3.5vw, 12px); }
      .controls {
        bottom: 50px;
        left: 16px;
        right: 16px;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      button { padding: 8px 12px; font-size: 11px; }
      .brand-tag {
        bottom: 14px;
        left: 16px;
        right: 16px;
        text-align: center;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="hud-overlay">
    <div class="hud-badge">● SYSTEM ACTIVE</div>
    <div class="hud-title">CYBERPUNK MATRIX RAIN</div>
    <div class="hud-subtitle">Interactive Quantum Data Stream</div>
  </div>

  <div class="controls">
    <button onclick="toggleColor('green')">Emerald Green</button>
    <button onclick="toggleColor('cyan')">Neon Cyan</button>
    <button onclick="toggleColor('purple')">Cyber Violet</button>
  </div>

  <div class="brand-tag">ENGINEERED BY <span>@AhadProCoder</span></div>

  <canvas id="matrix"></canvas>

  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initColumns();
    });

    const characters = 'アカサタナハマヤラワガザダバパイキシチニヒミリヰギジヂビピウクスツヌフムユルグズヅブプエケセテネヘメレヱゲゼデベペオコソトノホモヨロヲゴゾドボポ0123456789ABCDEF<>/*+=@#$%&';
    const fontSize = 16;
    let columns = [];
    let activeColor = '#00ff66';
    let headColor = '#ffffff';

    function initColumns() {
      const colCount = Math.floor(width / fontSize);
      columns = [];
      for (let i = 0; i < colCount; i++) {
        columns.push({
          y: Math.random() * -100,
          speed: 1 + Math.random() * 2.5
        });
      }
    }
    initColumns();

    let mouse = { x: -1000, y: -1000, radius: 120 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function toggleColor(color) {
      if (color === 'green') activeColor = '#00ff66';
      if (color === 'cyan') activeColor = '#00f0ff';
      if (color === 'purple') activeColor = '#d946ef';
    }

    function render() {
      ctx.fillStyle = 'rgba(3, 7, 18, 0.08)';
      ctx.fillRect(0, 0, width, height);

      ctx.font = `${fontSize}px monospace`;

      for (let i = 0; i < columns.length; i++) {
        const col = columns[i];
        const x = i * fontSize;
        const y = col.y * fontSize;

        const char = characters[Math.floor(Math.random() * characters.length)];

        const dx = mouse.x - x;
        const dy = mouse.y - y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < mouse.radius) {
          ctx.fillStyle = '#ff0055';
          ctx.shadowColor = '#ff0055';
          ctx.shadowBlur = 15;
        } else {
          ctx.fillStyle = Math.random() > 0.92 ? headColor : activeColor;
          ctx.shadowColor = activeColor;
          ctx.shadowBlur = 8;
        }

        ctx.fillText(char, x, y);
        ctx.shadowBlur = 0;

        if (y > height && Math.random() > 0.975) {
          col.y = 0;
        }
        col.y += col.speed;
      }

      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
